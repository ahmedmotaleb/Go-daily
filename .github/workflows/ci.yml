name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: godaily
          POSTGRES_PASSWORD: godaily
          POSTGRES_DB: godaily_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U godaily -d godaily_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://godaily:godaily@localhost:5432/godaily_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest
      - name: Migrations apply to a clean database and downgrade cleanly
        env:
          DATABASE_URL: postgresql+psycopg://godaily:godaily@localhost:5432/godaily_test
        run: |
          uv run python -c "import sqlalchemy as sa, os; e=sa.create_engine(os.environ['DATABASE_URL']); c=e.connect(); c.execute(sa.text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  web:
    name: Admin web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web lint
      - run: pnpm --filter admin-web format:check
      - run: pnpm --filter admin-web typecheck
      - run: pnpm --filter admin-web test
      - run: pnpm --filter admin-web build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build --target runtime -t go-daily/api:ci apps/api
      - run: docker build -f apps/admin-web/Dockerfile -t go-daily/admin-web:ci .

  android:
    name: Driver app (core tests, Android build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core logic tests (pure Kotlin/JVM)
        run: ./gradlew --no-daemon -p core test
      - name: Android debug build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-lint
          path: apps/driver-android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
