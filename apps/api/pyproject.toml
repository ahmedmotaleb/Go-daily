[project]
name = "go-daily-api"
version = "0.1.0"
description = "Go Daily Fleet Control & Operations System - API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0,<2.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PL"]
ignore = [
  "B008",     # FastAPI's Depends() in defaults is idiomatic
  "PLR0913",  # explicit keyword-heavy service functions are fine
  "PLR2004",  # magic numbers in tests/validation
  "N818",     # domain error names read better without an Error suffix
  "PLR0911",  # early returns are clearer than nesting
  "PLR0917",  # FastAPI handlers take many query parameters
  "RUF001", "RUF002", "RUF003",  # Arabic text is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning:app.*"]
