# Go Daily local stack: PostgreSQL + API + admin web.
#
#   cp .env.example .env      # then edit values
#   docker compose up --build
#
# The `migrate` service applies Alembic migrations before the API starts.

name: go-daily

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Cairo}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-godaily}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-godaily}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  # Required outside development: encrypts national IDs (see .env.example).
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  # Proxies whose X-Forwarded-For is trusted (uvicorn). Only the reverse proxy.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  EXCEPTION_OPERATING_AREAS: ${EXCEPTION_OPERATING_AREAS:-}
  NOTIFICATION_CHANNELS: ${NOTIFICATION_CHANNELS:-}
  BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-مدير النظام}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_ROOT: /app/var/attachments
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-godaily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-godaily}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: apps/api
      target: runtime
    image: go-daily/api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: go-daily/api:local
    restart: unless-stopped
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Attachments when STORAGE_BACKEND=local. Back this volume up.
      - attachments-data:/app/var/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    image: go-daily/admin-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      # Map tiles (HTTPS). The default OpenStreetMap servers are for light use only.
      # Empty = the built-in OpenStreetMap default (see .env.example).
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  attachments-data:
